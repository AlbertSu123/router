name: Router regression checks
on:
  push:
    branches: [main, feat/codex-accounts]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: CLI, authentication, proxy, and metering tests
        run: bun test cli metering
      - name: Isolated login, config migration, and launchd regression tests
        run: python3 -m unittest discover -s cli/tests -p '*integration.py' -v
      - name: Build menu bar app
        run: swift build --package-path menubar
      - name: Reset tracking checks
        run: |
          swiftc menubar/Sources/Router/ResetTracking.swift menubar/Tests/ResetTrackingChecks.swift -o "$RUNNER_TEMP/reset-checks"
          "$RUNNER_TEMP/reset-checks"
